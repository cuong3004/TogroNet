ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # =====================
    # IMU (ICM20948, fused - orientation + gyro deu sach)
    # =====================
    imu0: imu_sensor_broadcaster/imu

    # Thu tu state: [x, y, z, roll, pitch, yaw,
    #                vx, vy, vz, vroll, vpitch, vyaw,
    #                ax, ay, az]
    #
    # Fuse ca yaw tuyet doi (dinh huong dai han, chong troi) LAN vyaw
    # (van toc goc tuc thoi). Chi fuse yaw ma khong fuse vyaw se khien
    # EKF phai tu suy luan van toc goc qua process model, hoi tu rat
    # cham (~3s) sau moi lan doi huong - da kiem chung tren robot that.
    # Fuse ca hai giup EKF bam sat toc do quay thuc chi trong ~0.3-0.5s.
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]

    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10

    imu0_remove_gravitational_acceleration: true

    # =====================
    # Wheel odom
    # =====================
    odom0: diff_drive_controller/odom

    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, false,
                   false, false, false]

    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # process_noise_covariance: da thu set tuong minh (nang vyaw len 0.04)
    # nhung gay ra loi that: wz_filt bao ~0 trong khi yaw_filt van troi
    # deu ~0.8 deg/s hang giay lien - hai state noi bo khong khop nhau.
    # Bo lai, dung mac dinh cua robot_localization (khong set gi ca) -
    # day la cau hinh da kiem chung on dinh truoc do.
