bt_navigator:
  ros__parameters:
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    default_nav_to_pose_bt_xml: "/home/pi/dev_ws/src/turtlebot4_navigation/behavior_tree/navigate_through_poses_backup_spin.xml"
    default_nav_through_poses_bt_xml: "/home/pi/dev_ws/src/turtlebot4_navigation/behavior_tree/navigate_through_poses_backup_spin.xml"
    default_server_timeout: 1000

controller_server:
  ros__parameters:

    # Robot chạy chậm không nhất thiết cần MPPI chạy 20 Hz
    controller_frequency: 10.0
    odom_topic: /odometry/filtered

    failure_tolerance: 1.0

    general_goal_checker:
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
    
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 20.0

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # -------------------------------------------------------
      # Tốc độ
      # -------------------------------------------------------
      desired_linear_vel: 0.20

      # -------------------------------------------------------
      # Lookahead
      # -------------------------------------------------------
      lookahead_dist: 0.20
      min_lookahead_dist: 0.12
      max_lookahead_dist: 0.30
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true

      # -------------------------------------------------------
      # Giảm tốc theo độ cong
      # -------------------------------------------------------
      use_regulated_linear_velocity_scaling: true

      # Giảm nhẹ để robot không giảm tốc quá sớm
      regulated_linear_scaling_min_radius: 0.40

      # 0.025 m/s có thể quá thấp và dễ rơi vào vùng chết động cơ
      regulated_linear_scaling_min_speed: 0.04

      # -------------------------------------------------------
      # Giảm tốc gần vật cản
      # -------------------------------------------------------
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0

      # Đồng nhất với inflation layer
      inflation_cost_scaling_factor: 4.0

      # -------------------------------------------------------
      # Kiểm tra va chạm
      # -------------------------------------------------------
      use_collision_detection: true

      # Giảm nhẹ để không dừng quá sớm do vật cản ở xa
      max_allowed_time_to_collision_up_to_carrot: 0.8

      # -------------------------------------------------------
      # Tiếp cận đích
      # -------------------------------------------------------
      # Không giảm tốc từ quá xa
      approach_velocity_scaling_dist: 0.25

      # Tránh lệnh nhỏ hơn vùng chết của động cơ
      min_approach_linear_velocity: 0.03

      # -------------------------------------------------------
      # Xoay về hướng đường đi trước khi chạy
      # -------------------------------------------------------
      use_rotate_to_heading: true

      # 0.8 rad/s hơi gắt với robot nhỏ
      rotate_to_heading_angular_vel: 0.25

      # Xoay nếu lệch hướng lớn hơn khoảng 23 độ
      rotate_to_heading_min_angle: 0.40

      # Đồng nhất tương đối với velocity smoother
      max_angular_accel: 1.20

      # Không chạy lùi
      allow_reversing: false

      # -------------------------------------------------------
      # TF và goal handling
      # -------------------------------------------------------
      transform_tolerance: 0.20
      stateful: true


local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true

      # LiDAR 5 Hz nên giữ costmap cập nhật 5 Hz
      update_frequency: 3.0
      publish_frequency: 1.0

      global_frame: odom
      robot_base_frame: base_footprint


      # Khung ~30x30cm, banh xe (truc quay = base_footprint) gan mep
      # truoc, khong o giua khung - uoc luong: truc cach mep truoc ~7cm,
      # cach mep sau ~25cm, rong +-16cm. Hinh chu nhat LECH TAM (khong
      # doi xung nhu ban goc TurtleBot4) de phan anh dung phan duoi robot
      # thap ra sau truc quay - truoc day dung hinh tron doi xung ban
      # kinh 18.9cm nen danh gia thap phan duoi, gay dung vat luc quay.
      # DA THU tang len +-0.20m/0.09/0.28 nhung qua rong cho loi di hep
      # giua cac hang cay - controller bao "collision ahead" moi huong
      # kien tuc, ke ca luc lui (backup fail), robot ket cung, bo mat het
      # 4 waypoint (da kiem chung that tren robot). Quay lai muc cu da
      # kiem chung on dinh (khong thieu waypoint, ve nha 0.047m).
      footprint: "[[ 0.07,  0.16],
                   [ 0.07, -0.16],
                   [-0.25, -0.16],
                   [-0.25,  0.16]]"

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"

          clearing: true
          marking: true

          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: true

          obstacle_min_range: 0.15
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

        # Khoảng cách tính từ tâm vật cản
        inflation_radius: 0.25

        # Cost giảm tương đối nhanh, tránh robot né quá rộng
        cost_scaling_factor: 4.0

      # Chỉ gửi vùng costmap thay đổi
      always_send_full_costmap: false
    
      filters:
          - keepout_filter

      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/keepout_costmap_filter_info"

      # robot_radius: 0.01

global_costmap:
  global_costmap:
    ros__parameters:

      # Chỉ gửi phần costmap thay đổi
      always_send_full_costmap: false
      robot_base_frame: base_footprint

      # Giong local_costmap - hinh chu nhat lech tam theo truc banh xe
      # (xem giai thich o local_costmap ben tren).
      # DA THU tang len +-0.20m/0.09/0.28 nhung qua rong cho loi di hep
      # giua cac hang cay - controller bao "collision ahead" moi huong
      # kien tuc, ke ca luc lui (backup fail), robot ket cung, bo mat het
      # 4 waypoint (da kiem chung that tren robot). Quay lai muc cu da
      # kiem chung on dinh (khong thieu waypoint, ve nha 0.047m).
      footprint: "[[ 0.07,  0.16],
                   [ 0.07, -0.16],
                   [-0.25, -0.16],
                   [-0.25,  0.16]]"

      filters:
        - keepout_filter

      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/keepout_costmap_filter_info"

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.25
      
