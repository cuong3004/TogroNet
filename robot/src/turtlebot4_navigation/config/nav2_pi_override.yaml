smoother_server:
  ros__parameters:
    simple_smoother:

      # 1000 vòng lặp là khá nhiều với bản đồ nhỏ
      max_its: 200

      # Không chạy thêm vòng refinement
      do_refinement: false

behavior_server:
  ros__parameters:
    robot_base_frame: base_footprint
    max_rotational_vel: 0.30
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.60
    transform_tolerance: 0.2


velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    

    smoothing_frequency: 10.0
    scale_velocities: false
    feedback: "OPEN_LOOP"

    max_velocity: [0.10, 0.0, 0.8]
    min_velocity: [-0.08, 0.0, -0.8]

    max_accel: [0.20, 0.0, 1.0]
    max_decel: [-0.30, 0.0, -1.2]

    odom_topic: "/odometry/filtered"
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0